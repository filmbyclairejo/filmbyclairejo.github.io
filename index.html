        <script>
            (function () {
                var modal  = document.getElementById('videoModal');
                var player = document.getElementById('videoModalPlayer');
                var closeBtn = document.getElementById('videoModalClose');

                function openVideo(src) {
                    player.src = src;
                    modal.classList.add('open');
                    document.body.style.overflow = 'hidden';
                    var p = player.play();
                    if (p && typeof p.catch === 'function') { p.catch(function(){}); }
                }
                function closeVideo() {
                    modal.classList.remove('open');
                    player.pause();
                    player.removeAttribute('src');
                    player.load();
                    document.body.style.overflow = '';
                }

                document.querySelectorAll('.portfolio .item video.item-cover').forEach(function (vid) {
                    vid.addEventListener('click', function (e) {
                        e.preventDefault();
                        var source = vid.querySelector('source');
                        if (!source) return;
                        openVideo(source.getAttribute('src'));
                    });
                });

                closeBtn.addEventListener('click', closeVideo);
                modal.addEventListener('click', function (e) {
                    if (e.target === modal) closeVideo();
                });
                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape' && modal.classList.contains('open')) closeVideo();
                });
            })();
        </script>
